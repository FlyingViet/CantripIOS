name: Copy KEYCHAIN_PASSWORD to cantrip (one-time)

# Cantrip Agent moved to FlyingViet/cantrip (Clients/CantripIOS). This copies the TestFlight
# keychain secret into cantrip's testflight environment with the runner's own gh sign-in, so the
# value is never typed or printed. Removed right after it runs.
on: workflow_dispatch

permissions: {}

jobs:
  copy:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Set cantrip's testflight KEYCHAIN_PASSWORD
        env:
          VALUE: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$VALUE"
          printf %s "$VALUE" | gh secret set KEYCHAIN_PASSWORD --env testflight -R FlyingViet/cantrip
