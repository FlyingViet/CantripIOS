name: Copy KEYCHAIN_PASSWORD to cantrip (one-time)

# Cantrip Agent moved to FlyingViet/cantrip (Clients/CantripIOS). This hands the TestFlight
# keychain secret to a named pipe on the runner's Mac, where a signed-in gh sets it in cantrip's
# testflight environment: never typed, printed or written to disk. Removed right after it runs.
on: workflow_dispatch

permissions: {}

jobs:
  copy:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 3
    steps:
      - name: Set cantrip's testflight KEYCHAIN_PASSWORD
        env:
          VALUE: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$VALUE"
          PIPE="$HOME/.cache/Cantrip/kc-transfer.fifo"
          test -p "$PIPE"
          printf %s "$VALUE" > "$PIPE"
